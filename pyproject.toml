[project]
name = "pharm-agent"
version = "0.1.0"
description = "Pharmaceutical chemistry agents with LangChain, RDKit, and LLMs"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pharm Agent" }]
dependencies = [
    "langchain>=0.2.10",
    "langchain-community>=0.2.9",
    "langchain-core>=0.2.21",
    "langchain-openai>=0.1.22",
    "duckduckgo-search>=5.3.1",
    "wikipedia>=1.4.0",
    "arxiv>=2.1.3",
    "serpapi>=0.1.5",
    "requests>=2.32.3",
    "rdkit-pypi>=2022.9.5",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "matplotlib>=3.9.0",
    "Pillow>=10.3.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "tqdm>=4.66.4",
    "pydantic>=2.7.4",
]

[project.scripts]
pharm-agent = "pharm_agent.cli:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pharm_agent*"]
